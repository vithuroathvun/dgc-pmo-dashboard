<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGC PMO Agent Dashboard</title>
<style>
:root {
  --fg: var(--foreground, #e4e4e7);
  --muted: var(--muted-foreground, #71717a);
  --accent: var(--accent, #3b82f6);
  --border: var(--border, #27272a);
  --card-bg: var(--card, #18181b);
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: transparent; color: var(--fg); font-size: 13px; padding: 12px; width: fit-content; }
.header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.header h1 { font-size: 15px; font-weight: 600; }
.header .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.summary-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; }
.stat .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat .value { font-size: 16px; font-weight: 700; }
.stat.green .value { color: var(--green); }
.stat.amber .value { color: var(--amber); }
.stat.red .value { color: var(--red); }
.agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; max-width: 1400px; }
.agent-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; transition: border-color 0.2s; cursor: pointer; }
.agent-card:hover { border-color: var(--accent); }
.agent-card.green { border-left: 3px solid var(--green); }
.agent-card.amber { border-left: 3px solid var(--amber); }
.agent-card.red { border-left: 3px solid var(--red); }
.agent-card.none { border-left: 3px solid var(--muted); opacity: 0.6; }
.agent-card.scan { border-left: 3px solid var(--accent); }
.agent-card.scan::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); animation: scan-bar 1.5s ease-in-out infinite; }
@keyframes scan-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.agent-card { position: relative; overflow: hidden; }
.agent-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.agent-name { font-weight: 600; font-size: 12px; }
.agent-code { font-size: 10px; color: var(--muted); }
.agent-badge { font-size: 9px; padding: 1px 5px; border-radius: 8px; text-transform: uppercase; font-weight: 600; }
.agent-badge.green { background: rgba(34,197,94,0.15); color: var(--green); }
.agent-badge.amber { background: rgba(245,158,11,0.15); color: var(--amber); }
.agent-badge.red { background: rgba(239,68,68,0.15); color: var(--red); }
.agent-badge.none { background: rgba(113,113,122,0.15); color: var(--muted); }
.agent-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.metric { text-align: center; }
.metric .num { font-size: 14px; font-weight: 700; }
.metric .lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; }
.metric.overdue .num { color: var(--red); }
.metric.raid .num { color: var(--amber); }
.agent-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.agent-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.agent-bar-fill.green { background: var(--green); }
.agent-bar-fill.amber { background: var(--amber); }
.agent-bar-fill.red { background: var(--red); }
.agent-bar-fill.none { background: var(--muted); }
.agent-thinking { font-size: 11px; color: var(--muted); line-height: 1.4; padding: 4px 6px; background: rgba(255,255,255,0.02); border-radius: 4px; border-left: 2px solid var(--accent); }
.agent-recs { display: flex; flex-direction: column; gap: 2px; }
.agent-rec { font-size: 11px; line-height: 1.3; padding-left: 4px; }
.agent-actions { display: flex; gap: 4px; }
.btn { font-size: 10px; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.last-scan { font-size: 9px; color: var(--muted); }
.footer { margin-top: 10px; font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; }
.footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
.detail-panel { display: none; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px; font-size: 11px; }
.detail-panel.show { display: block; }
.detail-panel h4 { font-size: 11px; margin-bottom: 4px; color: var(--accent); }
.detail-list { list-style: none; }
.detail-list li { padding: 2px 0; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.03); }
</style>
</head>

function render() {
  const grid = document.getElementById('grid');
  let g=0, a=0, r=0, n=0, tt=0, to=0;

  const cards = STATES.map(s => {
    const h = s.health || 'none';
    if (h==='green') g++; else if (h==='amber') a++; else if (h==='red') r++; else n++;
    tt += (s.tasks_total||0); to += (s.tasks_overdue||0);
    const pct = (s.tasks_total||0) > 0 ? Math.round((s.tasks_done/s.tasks_total)*100) : 0;
    const cls = h;
    const badge = h === 'green' ? 'Healthy' : h === 'amber' ? 'At Risk' : h === 'red' ? 'Critical' : 'Idle';
    const scanTime = s.scanned_at ? new Date(s.scanned_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'never';

    let recsHtml = '';
    if (s.recommendations) {
      recsHtml = s.recommendations.slice(0,3).map(r => `<div class="agent-rec">${r}</div>`).join('');
    }

    let assessmentHtml = s.assessment ? `<div class="agent-thinking">💭 ${s.assessment}</div>` : '';

    let overdueHtml = '';
    if (s.overdue_tasks && s.overdue_tasks.length > 0) {
      const items = s.overdue_tasks.slice(0,3).map(t =>
        `<li>${t.title ? t.title.substring(0,45) : '?'} → <b>${t.assignee||'?'}</b> (due ${t.due_date||'?'})</li>`
      ).join('');
      overdueHtml = `<div class="detail-panel" id="detail-${s.short_code}">
        <h4>Top Overdue Tasks</h4><ul class="detail-list">${items}</ul>
      </div>`;
    }

    return `<div class="agent-card ${cls}" onclick="window.hermes.send('PMO detail ${s.short_code}')">
      <div class="agent-header">
        <div>
          <div class="agent-name">${s.name}</div>
          <div class="agent-code">${s.short_code} · ${s.manager||'Unassigned'}</div>
        </div>
        <div class="agent-badge ${cls}">${badge}</div>
      </div>
      <div class="agent-metrics">
        <div class="metric"><div class="num">${s.tasks_total||0}</div><div class="lbl">Tasks</div></div>
        <div class="metric"><div class="num" style="color:var(--green)">${s.tasks_done||0}</div><div class="lbl">Done</div></div>
        <div class="metric ${(s.tasks_overdue||0)>0?'overdue':''}"><div class="num">${s.tasks_overdue||0}</div><div class="lbl">Overdue</div></div>
        <div class="metric ${(s.raid_count||0)>0?'raid':''}"><div class="num">${s.raid_count||0}</div><div class="lbl">RAID</div></div>
      </div>
      <div class="agent-bar"><div class="agent-bar-fill ${cls}" style="width:${pct}%"></div></div>
      ${assessmentHtml}
      <div class="agent-recs">${recsHtml}</div>
      <div class="last-scan">Last scan: ${scanTime}</div>
      <div class="agent-actions">
        <button class="btn primary" onclick="event.stopPropagation();window.hermes.send('PMO scan ${s.short_code}')">▶ Scan</button>
        <button class="btn" onclick="event.stopPropagation();window.hermes.send('PMO ${s.short_code} recommendations')">💡 Why?</button>
        <button class="btn" onclick="event.stopPropagation();window.hermes.send('PMO ${s.short_code} overdue details')">📋 Details</button>
      </div>
      ${overdueHtml}
    </div>`;
  }).join('');

  grid.innerHTML = cards;
  document.getElementById('s-green').textContent = g;
  document.getElementById('s-amber').textContent = a;
  document.getElementById('s-red').textContent = r;
  document.getElementById('s-none').textContent = n;
  document.getElementById('s-tasks').textContent = tt;
  document.getElementById('s-overdue').textContent = to;
}
render();
</script>
